# Track O NoAlloc allowlist: runtime members needed by the mandatory SIMD, span and decoding
# variants (pre-registration §5.4, phase1-plan.md §7 steps O1-O4) that the analyzer's built-in
# BCL baseline does not list. Each entry is an assumed contract: no managed allocation, no lock,
# no blocking. Part of the Gate 2 ruleset; changing it after the tag is an amendment.

[[member]]
symbol = "cs:*/T:System.Runtime.Intrinsics.Vector128"
constraints = ["All"]
runtime = "*"
reason = "hardware intrinsics helpers: operate on registers, no allocation"

[[member]]
symbol = "cs:*/T:System.Runtime.Intrinsics.Vector128`1"
constraints = ["All"]
runtime = "*"
reason = "SIMD register value type: no allocation"

