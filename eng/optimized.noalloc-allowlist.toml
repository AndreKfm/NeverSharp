#
# NoAlloc allowlist of Track O (pre-registration §5.4 as amended by prereg/v6; written in step O-NA), part of the
# Track O Gate 2 ruleset (eng/Gate2.Optimized.props) next to simd.noalloc-allowlist.toml.
#
# Part 1: runtime library members the ported code calls from [NoAlloc] members that the analyzer's built-in BCL
# baseline (and eng/simd.noalloc-allowlist.toml) does not list. None of them allocates, locks or blocks.
#
# Part 2: the exceptions. Each entry is a member of Track O marked [NoAllocUnchecked(reason)] (arena growth, the
# per-file result, error paths, regex checking, rare numeric forms): the analyzer does not verify it, and this entry
# lets the [NoAlloc] members that call it on their rare paths keep their contract (without it the analyzer reports
# NS013 at every call). The list is the [NoAllocUnchecked] list of harness/port/noalloc-report.mjs, entry by entry.

# ---- Part 1: runtime library ----

